name: ci-cd

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Keyless auth to GCP via Workload Identity Federation needs id-token: write.
permissions:
  contents: read
  id-token: write

env:
  GAR_LOCATION: us-central1
  GAR_REPO: apps
  IMAGE_NAME: gke-microservice
  # Set these as repo Variables (Settings > Secrets and variables > Actions > Variables):
  #   GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_CI_SERVICE_ACCOUNT, GITOPS_REPO

jobs:
  # ---------------------------------------------------------------------------
  # 1. Quality gate: lint + unit tests. Runs on every push and PR.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59

      - name: Unit tests
        run: go test -race -covermode=atomic ./...

  # ---------------------------------------------------------------------------
  # 2. Filesystem/dependency security scan (fails PRs on HIGH/CRITICAL).
  # ---------------------------------------------------------------------------
  security-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # 3. Build multi-arch image, scan it, push to Artifact Registry.
  #    Only on push to main (not on PRs).
  # ---------------------------------------------------------------------------
  build-push:
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag (short SHA)
        id: meta
        run: echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Keyless auth: exchanges GitHub's OIDC token for GCP creds. No JSON key.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:latest

      - name: Trivy image scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # 4. GitOps trigger: bump the image tag in the GitOps repo. ArgoCD does the rest.
  # ---------------------------------------------------------------------------
  bump-gitops:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPO }}          # e.g. my-user/gke-gitops-infra
          token: ${{ secrets.GITOPS_TOKEN }}           # PAT or GitHub App token with repo write
          path: gitops

      - name: Update image tag with Kustomize
        working-directory: gitops/apps/microservice/overlays/prod
        run: |
          NEW_TAG="${{ needs.build-push.outputs.image_tag }}"
          curl -sLo kustomize \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64
          # (in the runner, kustomize is available; using the binary keeps it explicit)
          chmod +x kustomize || true
          IMG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}"
          kustomize edit set image microservice=${IMG}:${NEW_TAG}
          echo "Set image to ${IMG}:${NEW_TAG}"

      - name: Commit & push tag bump
        working-directory: gitops
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/microservice/overlays/prod/kustomization.yaml
          git commit -m "ci: bump microservice image to ${{ needs.build-push.outputs.image_tag }}" || echo "no changes"
          git push
