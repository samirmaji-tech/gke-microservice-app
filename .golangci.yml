version: "2"
run:
  timeout: 3m
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
  settings:
    revive:
      rules:
        - name: exported
          disable: true
        - name: package-comments
          disable: true
formatters:
  enable:
    - gofmt
